# pmtrack on itself: test, check templates, then refresh the review on
# branch pm-progress, as in examples/woodpecker-publish.yml but run from
# source. A cron job in Woodpecker keeps the review current, since issue
# edits don't trigger CI. Secret pm_token: forge token with issue read and
# repository write on this repo.
# The test step installs the package, so packaging is checked too; on a
# tag or release it also checks the tag matches the version. On a tag,
# once the tests pass, the release step creates the Forgejo release from
# CHANGELOG.md, as in examples/release-woodpecker.yml (pm_token must be
# allowed on the tag event). Templates and review run from source, and
# not on tags: there's no branch to commit to.
when:
  - event: [cron, manual, tag, release]
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}

steps:
  - name: test
    image: python:3.13-alpine
    when:
      - event: [push, manual, tag, release]
    commands:
      - pip install -q --root-user-action=ignore .
      - pmtrack --version
      - '[ -z "$${CI_COMMIT_TAG}" ] || [ "$${CI_COMMIT_TAG}" = "v$(pmtrack --version)" ]'
      - python3 -m unittest discover -s tests

  - name: release
    image: alpine:3.20
    when:
      - event: tag
        ref: refs/tags/v*
    environment:
      RELEASE_TOKEN:
        from_secret: pm_token
    commands:
      - apk add -q curl jq
      - TAG="$${CI_COMMIT_TAG}"
      - VER="$${TAG#v}"
      - API="$${CI_FORGE_URL}/api/v1/repos/$${CI_REPO}/releases"
      - 'AUTH="Authorization: token $${RELEASE_TOKEN}"'
      # 200: already released; 404: go ahead; anything else is a problem.
      - 'code=$(curl -s -o /dev/null -w "%{http_code}" -H "$${AUTH}" "$${API}/tags/$${TAG}")'
      - 'if [ "$${code}" = 200 ]; then echo "release $${TAG} exists; nothing to do"; exit 0; fi'
      - '[ "$${code}" = 404 ] || { echo "checking for release $${TAG}: HTTP $${code}"; exit 1; }'
      - 'awk -v h="## [$${VER}]" ''index($$0, h) == 1 {f = 1; next} f && /^(## \[|\[[^]]*\]: )/ {exit} f'' CHANGELOG.md > /tmp/notes.md'
      - 'grep -q "[^[:space:]]" /tmp/notes.md || { echo "CHANGELOG.md has no section for $${VER}"; exit 1; }'
      - 'printf "\nFull changelog: [CHANGELOG.md](%s/src/tag/%s/CHANGELOG.md)\n" "$${CI_REPO_URL}" "$${TAG}" >> /tmp/notes.md'
      - 'jq -n --arg tag "$${TAG}" --arg name "$${CI_REPO_NAME} $${VER}" --rawfile body /tmp/notes.md ''{tag_name: $tag, name: $name, body: $body}'' > /tmp/release.json'
      - 'curl -sf -o /dev/null -X POST -H "$${AUTH}" -H "Content-Type: application/json" --data @/tmp/release.json "$${API}"'
      - echo "released $${TAG}"

  - name: templates
    image: python:3.13-alpine
    when:
      - event: [push, manual, cron]
    commands:
      - pip install -q --root-user-action=ignore pyyaml
      - python3 pmtrack.py templates --check

  - name: review
    image: python:3.13-alpine
    when:
      - event: [push, manual, cron]
    environment:
      PM_TOKEN:
        from_secret: pm_token
      PM_BRANCH: pm-progress
    commands:
      - apk add -q git
      - pip install -q --root-user-action=ignore pyyaml
      - REMOTE="https://oauth2:$${PM_TOKEN}@$${CI_FORGE_URL#*://}/$${CI_REPO}.git"
      - git init -q /tmp/pub
      - git ls-remote --heads "$${REMOTE}" "$${PM_BRANCH}" > /tmp/heads
      - 'if [ -s /tmp/heads ]; then git -C /tmp/pub fetch -q --depth 1 "$${REMOTE}" "$${PM_BRANCH}" && git -C /tmp/pub checkout -q -b "$${PM_BRANCH}" FETCH_HEAD; else git -C /tmp/pub checkout -q --orphan "$${PM_BRANCH}"; fi'
      - python3 pmtrack.py review --publish /tmp/pub --ref "$${CI_COMMIT_BRANCH}"
      - cd /tmp/pub
      - git add -A
      - git diff --cached --quiet && exit 0
      - 'git -c user.name=pmtrack -c user.email=pmtrack@noreply.invalid commit -qm "progress: update review [CI SKIP]"'
      - git push -q "$${REMOTE}" "HEAD:$${PM_BRANCH}"
