[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pmtrack"
dynamic = ["version"]
description = "Project overview and progress review from plan docs and issues, on any forge"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pyyaml"]

[project.scripts]
pmtrack = "pmtrack:main"

[tool.setuptools]
py-modules = ["pmtrack"]

[tool.setuptools.dynamic]
version = {attr = "pmtrack.VERSION"}
